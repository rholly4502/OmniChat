name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger dari GitHub Actions tab

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Abort on the first failing command. Without this a failed `git pull` was
            # silently ignored, the build ran against stale source, and the job still
            # reported success.
            set -euo pipefail
            cd /opt/OmniChat

            echo "=== Target commit: ${{ github.sha }} ==="

            # The deploy checkout is READ-ONLY: origin/main is the source of truth.
            # A dirty working tree previously made `git pull` abort, so the image was
            # rebuilt from stale code. Preserve any local modification as a patch for
            # review, then hard-sync to the pushed commit.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              BACKUP="/tmp/omnichat-local-$(date +%Y%m%d-%H%M%S).patch"
              git diff HEAD > "$BACKUP"
              echo "WARNING: local modifications detected — saved to $BACKUP"
              git status --short
            fi

            git fetch --prune origin main
            git reset --hard origin/main
            # Remove stray untracked build leftovers. No -x, so ignored files (.env) survive.
            git clean -fd

            DEPLOYED_SHA="$(git rev-parse HEAD)"
            echo "=== Deployed commit: $DEPLOYED_SHA ==="
            if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
              echo "ERROR: deployed commit $DEPLOYED_SHA != pushed commit ${{ github.sha }}"
              exit 1
            fi

            echo "=== Building images ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache frontend backend

            echo "=== Starting services ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # The Caddy service bind-mounts the Caddyfile as a single FILE. A container that
            # is already running keeps the mount it resolved at start-up, so a config edited
            # on disk (git reset --hard, editor save) can stay invisible to `caddy reload`.
            # Validate against the host file in a throwaway container — that always reads the
            # current bytes — then force-recreate the service so the mount is re-resolved.
            echo "=== Validating Caddyfile (from host) ==="
            docker run --rm --entrypoint caddy \
              -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2-alpine validate --config /etc/caddy/Caddyfile

            echo "=== Recreating Caddy so it picks up the Caddyfile ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate caddy

            echo "=== Waiting for backend health ==="
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5184/health > /dev/null; then
                echo "backend healthy after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: backend did not become healthy within 30s"
                docker compose -f docker-compose.yml -f docker-compose.prod.yml logs backend --tail=50
                exit 1
              fi
              sleep 1
            done

            echo "=== Container status ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            # Assert /health is answered by the API, not by the SPA. The frontend nginx serves
            # index.html for unknown paths, so a 200 alone proves nothing — it previously hid
            # a Caddy route that had stopped sending /health to the backend.
            echo "=== Public health check (must reach the API) ==="
            for i in $(seq 1 15); do
              BODY="$(curl -fsS https://rhol-ai.tech/health 2>/dev/null || true)"
              if printf '%s' "$BODY" | grep -q '"status"'; then
                echo "/health served by the API: $BODY"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "ERROR: /health is not reaching the API after 15 attempts."
                echo "Last body: $BODY"
                docker compose -f docker-compose.yml -f docker-compose.prod.yml logs caddy --tail=30
                exit 1
              fi
              sleep 2
            done

            echo "=== Deploy complete: $DEPLOYED_SHA ==="
