name: Deploy OmniChat

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          REMOTE_SCRIPT: |
            set -euo pipefail
            docker network inspect shared_bridge >/dev/null 2>&1 || docker network create shared_bridge
            cd /opt/OmniChat
            git fetch --prune origin main && git reset --hard origin/main
            git clean -fd
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache frontend backend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate caddy
            sleep 8
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            curl -s -o /dev/null -w "root_http=%{http_code}\n" https://rhol-ai.tech/api/health || echo "health check failed"
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          printf '%s\n' "$REMOTE_SCRIPT" | ssh \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -p "$PORT" \
            "${VPS_USER}@${VPS_HOST}" 'bash -s'
