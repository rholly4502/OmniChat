name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: .NET 10 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
      - name: Restore & Build
        run: dotnet build OmniChat.slnx -c Release

      - name: Test
        run: dotnet test OmniChat.slnx -c Release --no-build --verbosity normal

  frontend:
    name: React Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Lint & Test & Build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
