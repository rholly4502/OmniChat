name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OmniChat.slnx

      - name: Build (lint DL100/DL101 gate)
        run: dotnet build OmniChat.slnx -c Release --no-restore

      - name: Test (unit + integration)
        run: dotnet test tests/OmniChat.Tests/OmniChat.Tests.csproj -c Release --no-build

      - name: Test (architecture gate)
        run: dotnet test tests/OmniChat.ArchitectureTests/OmniChat.ArchitectureTests.csproj -c Release --no-build

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
