services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5184:5184"
    # host.docker.internal resolves to the Docker host on Linux
    # (Docker Desktop provides it automatically; native Linux needs this mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5184
      # Hermes gateway runs on the host — localhost would mean THIS container.
      - Hermes__Endpoint=${Hermes__Endpoint:-http://host.docker.internal:5000/v1/chat/completions}
      - LLM__ApiKey=${LLM_API_KEY:-}
      - Security__ApiKey=${Security__ApiKey:-}
      - Cors__AllowedOrigins=${Cors__AllowedOrigins:-}
      - Security__Jwt__SigningKey=${Security__Jwt__SigningKey:-}
      - Security__Jwt__Issuer=${Security__Jwt__Issuer:-OmniChat}
      - Security__Jwt__Audience=${Security__Jwt__Audience:-OmniChat}
      - LLM__Endpoint=${LLM__Endpoint:-https://openrouter.ai/api/v1/chat/completions}
      - Kestrel__MaxRequestBodySizeBytes=${Kestrel__MaxRequestBodySizeBytes:-10485760}
      - ReverseProxy__Enabled=${ReverseProxy__Enabled:-false}
      - ReverseProxy__KnownProxies=${ReverseProxy__KnownProxies:-}
      - ReverseProxy__KnownNetworks=${ReverseProxy__KnownNetworks:-}
      - ReverseProxy__ForwardLimit=${ReverseProxy__ForwardLimit:-1}
      # Model catalog — optional JSON arrays (see .env.example). Empty = built-in defaults.
      - Models__Agent=${Models__Agent:-}
      - Models__Direct=${Models__Direct:-}
      # Rate limiting — token bucket per IP. Defaults: 10 tokens / 60s.
      - RateLimit__TokenLimit=${RateLimit__TokenLimit:-10}
      - RateLimit__ReplenishmentPeriodSeconds=${RateLimit__ReplenishmentPeriodSeconds:-60}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5184/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    # nginx serves static files and proxies /api/* to the backend service.
    # nginx.conf handles the proxy — no vite env var needed.
    healthcheck:
      # nginx:alpine has wget in BusyBox. Use -q for quiet, --spider for HEAD.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # nginx has its own security model (master=root, workers=nginx user).
    # cap_drop:ALL breaks nginx — it needs CAP_CHOWN for cache dirs.
    # no-new-privileges is safe and doesn't interfere with nginx startup.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
