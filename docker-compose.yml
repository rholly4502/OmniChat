services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5184:5184"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5184
      - Hermes__Endpoint=http://localhost:5000/v1/chat/completions
      - LLM__ApiKey=${LLM_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5184/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
